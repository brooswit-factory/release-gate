name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun test

  release-gate:
    uses: ./.github/workflows/gate.yml
    with:
      gated-paths: '["^scripts/", "^\\.github/workflows/gate\\.yml$", "^package\\.json$"]'
